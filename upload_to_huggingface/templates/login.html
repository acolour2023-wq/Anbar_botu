<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi - Anbar Sayımı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap&subset=latin,latin-ext" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06111f;
            --bg-secondary: #0f1f3d;
            --card-bg: #1a2d4d;
            --input-bg: #253d5f;
            --text-color: #f0f4f9;
            --text-muted: #8fa3ba;
            --accent: #5b7cff;
            --accent-hover: #4462dd;
            --accent-light: #7a99ff;
            --success: #00d084;
            --success-dark: #00a862;
            --danger: #ff4757;
            --warning: #ffa502;
            --border: #2d3f5b;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--bg-secondary) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(91, 124, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 50%, rgba(0, 208, 132, 0.08) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: linear-gradient(135deg, rgba(26, 45, 77, 0.95) 0%, rgba(37, 61, 95, 0.95) 100%);
            border-radius: 20px;
            padding: 40px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-lg), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-field {
            width: 100%;
            background-color: var(--input-bg);
            border: 1.5px solid var(--border);
            color: var(--text-color);
            padding: 14px 16px 14px 48px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .input-field::placeholder {
            color: rgba(143, 163, 186, 0.5);
        }

        .input-field:focus {
            border-color: var(--accent);
            background-color: rgba(91, 124, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(91, 124, 255, 0.1);
        }

        .input-field:focus ~ .input-icon {
            color: var(--accent);
            transform: scale(1.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(91, 124, 255, 0.25);
            margin-top: 8px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(91, 124, 255, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert-box {
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.15), rgba(255, 71, 87, 0.08));
            border: 1.5px solid rgba(255, 71, 87, 0.4);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.15);
            margin-bottom: 8px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(91, 124, 255, 0.2), transparent);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <h1>🔐 Anbar</h1>
                <p>Admin İdarəetmə Paneli</p>
            </div>

            <div id="alert" class="alert-box">
                <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alert-text">Xəta baş verdi!</span>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">İstifadəçi Adı</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            class="input-field"
                            required
                            placeholder="Admin adınızı daxil edin"
                            autocomplete="username"
                        >
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Şifrə</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            class="input-field"
                            required
                            placeholder="Şifrənizi daxil edin"
                            autocomplete="current-password"
                        >
                        <span class="input-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span>🔓 Daxil ol</span>
                </button>
            </form>

            <div class="divider"></div>

            <div class="footer-text">
                © 2026 Anbar Sayımı Sistemi · Güvənli Giriş
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();

            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const submitBtn = document.getElementById("submit-btn");
            const alertBox = document.getElementById("alert");
            const alertText = document.getElementById("alert-text");

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            alertBox.style.display = "none";
            submitBtn.disabled = true;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    window.location.href = "/admin";
                } else {
                    alertText.innerText = data.message || "İstifadəçi adı və ya şifrə yanlışdır!";
                    alertBox.style.display = "flex";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                alertText.innerText = "Şəbəkə xətası baş verdi. Yenidən cəhd edin.";
                alertBox.style.display = "flex";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
